<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>midden · recovery workbench</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span>
          <span class="brand-mark">midden</span>
          <span class="brand-sub">recovery workbench</span>
        </span>
        <button id="nav-close" class="icon-button nav-close" type="button" aria-label="Close navigation">&times;</button>
      </div>

      <nav class="primary-nav" aria-label="Product">
        <span class="nav-section">Recover and create</span>
        <button class="nav-item active" data-view="recover" type="button">
          <span class="nav-symbol" aria-hidden="true">R</span><span>Recover</span><span class="nav-count" id="nav-recover-count">0</span>
        </button>
        <button class="nav-item" data-view="studio" type="button">
          <span class="nav-symbol" aria-hidden="true">S</span><span>Studio</span><span class="nav-count" id="nav-studio-count">0</span>
        </button>
        <button class="nav-item" data-view="library" type="button">
          <span class="nav-symbol" aria-hidden="true">L</span><span>Library</span><span class="nav-count" id="nav-library-count">0</span>
        </button>
        <button class="nav-item" data-view="cleanup" type="button">
          <span class="nav-symbol" aria-hidden="true">C</span><span>Cleanup</span><span class="nav-count" id="nav-cleanup-count">0</span>
        </button>

        <span class="nav-section">System</span>
        <button class="nav-item" data-view="activity" type="button">
          <span class="nav-symbol" aria-hidden="true">A</span><span>Activity</span><span class="nav-count" id="nav-activity-count">0</span>
        </button>
        <button class="nav-item" data-view="tools" type="button">
          <span class="nav-symbol" aria-hidden="true">T</span><span>Tools</span><span class="nav-count" id="nav-tools-count">0</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="local-card">
          <strong><span class="status-dot"></span> Local service ready</strong>
          <span>Source stores remain read-only. Jobs, chat, previews, and exports stay on this machine.</span>
        </div>
      </div>
    </aside>
    <button class="nav-backdrop" id="nav-backdrop" type="button" aria-label="Close navigation" hidden></button>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button id="nav-toggle" class="icon-button nav-toggle" type="button" aria-label="Open navigation">Menu</button>
          <div class="breadcrumb" id="view-title">Recover</div>
        </div>
        <div class="topbar-actions">
          <div class="topbar-badges" id="global-badges"></div>
          <button id="top-primary-action" class="button compact" type="button">New mine</button>
        </div>
      </header>
      <div class="notice-region" id="notice-region" role="status" aria-live="polite" hidden></div>

      <main id="main">
        <section class="view active" id="recover" aria-label="Recover">
          <div id="recover-content" class="view-content">
            <div class="loading-shell"><p class="loading-label">Loading recovery state…</p></div>
          </div>
        </section>
        <section class="view" id="studio" aria-label="Studio">
          <div id="studio-content" class="view-content"></div>
        </section>
        <section class="view" id="library" aria-label="Library">
          <div id="library-content" class="view-content"></div>
        </section>
        <section class="view" id="cleanup" aria-label="Cleanup">
          <div id="cleanup-content" class="view-content"></div>
        </section>
        <section class="view" id="activity" aria-label="Activity">
          <div id="activity-content" class="view-content"></div>
        </section>
        <section class="view" id="tools" aria-label="Tools">
          <div id="tools-content" class="view-content"></div>
        </section>
      </main>
    </div>
  </div>

  <aside class="task-dock" id="task-dock" aria-label="Background jobs" hidden>
    <button class="task-dock-head" id="task-dock-toggle" type="button">
      <span class="task-dock-title"><span class="status-dot"></span><strong id="task-dock-title">Background jobs</strong></span>
      <span class="badge blue" id="task-dock-status">idle</span>
    </button>
    <div class="task-dock-body" id="task-dock-body"></div>
  </aside>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="icon-button modal-close" id="modal-close" type="button" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </section>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-backdrop" data-close-drawer></div>
    <aside class="drawer-card" role="dialog" aria-modal="true" aria-label="Details">
      <button class="icon-button drawer-close" id="drawer-close" type="button" aria-label="Close">&times;</button>
      <div id="drawer-body"></div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="sr-only" id="live-region" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
