<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>midden · evidence refinery</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span>
          <span class="brand-mark">midden</span>
          <span class="brand-sub">evidence refinery</span>
        </span>
        <button id="nav-close" class="icon-button nav-close" type="button" aria-label="Close navigation">×</button>
      </div>

      <nav class="primary-nav" aria-label="Product">
        <button class="nav-item active" data-view="home" type="button">
          <span aria-hidden="true">⌂</span><span>Home</span>
        </button>
        <button class="nav-item" data-view="mine" type="button">
          <span aria-hidden="true">◇</span><span>Mine</span>
        </button>
        <button class="nav-item" data-view="studio" type="button">
          <span aria-hidden="true">▱</span><span>Studio</span>
        </button>
        <button class="nav-item" data-view="knowledge" type="button">
          <span aria-hidden="true">▤</span><span>Knowledge</span>
        </button>
        <button class="nav-item" data-view="agent-forge" type="button">
          <span aria-hidden="true">✦</span><span>Agent forge</span>
        </button>
        <button class="nav-item" data-view="personalization" type="button">
          <span aria-hidden="true">◎</span><span>Personalization</span>
        </button>
        <button class="nav-item" data-view="connections" type="button">
          <span aria-hidden="true">⌁</span><span>Connections</span>
        </button>
        <button class="nav-item" data-view="conductor" type="button">
          <span aria-hidden="true">◉</span><span>Conductor</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item secondary" data-view="operations" type="button">
          <span aria-hidden="true">⚙</span><span>Operations</span>
        </button>
        <div class="privacy-note">
          <strong>Local by default</strong>
          <span>Source sessions remain read-only. Publishing and model spend always require approval.</span>
        </div>
      </div>
    </aside>
    <button class="nav-backdrop" id="nav-backdrop" type="button" aria-label="Close navigation" hidden></button>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button id="nav-toggle" class="icon-button nav-toggle" type="button" aria-label="Open navigation">☰</button>
          <div>
            <div class="eyebrow" id="view-kicker">Evidence refinery</div>
            <div class="breadcrumb" id="view-title">Home</div>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="topbar-badges" id="global-badges"></div>
          <button id="refresh-data" class="button ghost compact" type="button">Refresh sources</button>
        </div>
      </header>
      <div class="notice-region" id="notice-region" role="status" aria-live="polite" hidden></div>

      <main id="main">
        <section class="view active" id="home" aria-labelledby="home-heading">
          <div id="home-content" class="view-content loading-shell">
            <p class="loading-label">Loading your local index…</p>
            <div class="loading-card"></div>
            <div class="loading-grid"><div></div><div></div><div></div></div>
          </div>
        </section>

        <section class="view" id="mine" aria-labelledby="mine-heading">
          <div id="mine-content" class="view-content"></div>
        </section>

        <section class="view" id="studio" aria-labelledby="studio-heading">
          <div id="studio-content" class="view-content"></div>
        </section>

        <section class="view" id="knowledge" aria-labelledby="knowledge-heading">
          <div id="knowledge-content" class="view-content"></div>
        </section>

        <section class="view" id="agent-forge" aria-labelledby="agent-heading">
          <div id="agent-content" class="view-content"></div>
        </section>

        <section class="view" id="personalization" aria-labelledby="personalization-heading">
          <div id="personalization-content" class="view-content"></div>
        </section>

        <section class="view" id="connections" aria-labelledby="connections-heading">
          <div id="connections-content" class="view-content"></div>
        </section>

        <section class="view" id="conductor" aria-labelledby="conductor-heading">
          <div id="conductor-content" class="view-content"></div>
        </section>

        <section class="view" id="operations" aria-labelledby="operations-heading">
          <div id="operations-content" class="view-content"></div>
        </section>
      </main>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="icon-button modal-close" id="modal-close" type="button" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </section>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-backdrop" data-close-drawer></div>
    <aside class="drawer-card" role="dialog" aria-modal="true" aria-label="Details">
      <button class="icon-button drawer-close" id="drawer-close" type="button" aria-label="Close">×</button>
      <div id="drawer-body"></div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="sr-only" id="live-region" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
