<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>midden · recovery workbench</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span>
          <span class="brand-mark">midden</span>
          <span class="brand-sub">recovery workbench</span>
        </span>
        <button id="nav-close" class="icon-button nav-close" type="button" aria-label="Close navigation">&times;</button>
      </div>

      <nav class="primary-nav" aria-label="Product">
        <span class="nav-section">Recovery Workflow</span>
        <button class="nav-item active" data-view="chat" type="button">
          <span class="nav-symbol" aria-hidden="true">💬</span><span>Agent Chat</span><span class="nav-count" id="nav-chat-count">—</span>
        </button>
        <button class="nav-item" data-view="mine" type="button">
          <span class="nav-symbol" aria-hidden="true">⛏</span><span>Mine / Recover</span><span class="nav-count" id="nav-mine-count">0</span>
        </button>
        <button class="nav-item" data-view="analyze" type="button">
          <span class="nav-symbol" aria-hidden="true">🔬</span><span>Analyze</span><span class="nav-count" id="nav-analyze-count">0</span>
        </button>
        <button class="nav-item" data-view="plan" type="button">
          <span class="nav-symbol" aria-hidden="true">📋</span><span>Plan / Studio</span><span class="nav-count" id="nav-plan-count">0</span>
        </button>
        <button class="nav-item" data-view="create" type="button">
          <span class="nav-symbol" aria-hidden="true">✨</span><span>Create / Library</span><span class="nav-count" id="nav-create-count">0</span>
        </button>

        <span class="nav-section">System</span>
        <button class="nav-item" data-view="runtime" type="button">
          <span class="nav-symbol" aria-hidden="true">⚙</span><span>Runtime &amp; Models</span>
        </button>
        <button class="nav-item" data-view="cleanup" type="button">
          <span class="nav-symbol" aria-hidden="true">🧹</span><span>Cleanup</span><span class="nav-count" id="nav-cleanup-count">0</span>
        </button>
        <button class="nav-item" data-view="activity" type="button">
          <span class="nav-symbol" aria-hidden="true">📜</span><span>Activity</span><span class="nav-count" id="nav-activity-count">0</span>
        </button>
        <button class="nav-item" data-view="tools" type="button">
          <span class="nav-symbol" aria-hidden="true">⚙</span><span>Tools</span><span class="nav-count" id="nav-tools-count">0</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="local-card">
          <strong><span class="status-dot"></span> Local service ready</strong>
          <span>Recovery state stays local. Model-backed chat sends selected context to the configured provider.</span>
        </div>
      </div>
    </aside>
    <button class="nav-backdrop" id="nav-backdrop" type="button" aria-label="Close navigation" hidden></button>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button id="nav-toggle" class="icon-button nav-toggle" type="button" aria-label="Open navigation">Menu</button>
          <div class="breadcrumb" id="view-title">Agent Chat</div>
        </div>
        <div class="topbar-actions">
          <div class="topbar-badges" id="global-badges"></div>
          <button id="top-primary-action" class="button compact" type="button">New mine</button>
        </div>
      </header>
      <div class="notice-region" id="notice-region" role="status" aria-live="polite" hidden></div>

      <main id="main">
        <section class="view" id="runtime" aria-label="Runtime and models">
          <div id="runtime-content" class="view-content"></div>
        </section>
        <section class="view active" id="chat" aria-label="Agent Chat">
          <div id="chat-content" class="view-content"></div>
        </section>
        <section class="view" id="mine" aria-label="Mine">
          <div id="mine-content" class="view-content">
            <div class="loading-shell"><p class="loading-label">Loading sessions…</p></div>
          </div>
        </section>
        <section class="view" id="analyze" aria-label="Analyze">
          <div id="analyze-content" class="view-content"></div>
        </section>
        <section class="view" id="plan" aria-label="Plan">
          <div id="plan-content" class="view-content"></div>
        </section>
        <section class="view" id="create" aria-label="Create">
          <div id="create-content" class="view-content"></div>
        </section>
        <section class="view" id="cleanup" aria-label="Cleanup">
          <div id="cleanup-content" class="view-content"></div>
        </section>
        <section class="view" id="activity" aria-label="Activity">
          <div id="activity-content" class="view-content"></div>
        </section>
        <section class="view" id="tools" aria-label="Tools">
          <div id="tools-content" class="view-content"></div>
        </section>
        <!-- Backwards-compatibility containers -->
        <div id="recover-content" style="display:none"></div>
        <div id="studio-content" style="display:none"></div>
        <div id="library-content" style="display:none"></div>
      </main>
    </div>
  </div>

  <aside class="task-dock" id="task-dock" aria-label="Background jobs" hidden>
    <button class="task-dock-head" id="task-dock-toggle" type="button">
      <span class="task-dock-title"><span class="status-dot"></span><strong id="task-dock-title">Background jobs</strong></span>
      <span class="badge blue" id="task-dock-status">idle</span>
    </button>
    <div class="task-dock-body" id="task-dock-body"></div>
  </aside>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="icon-button modal-close" id="modal-close" type="button" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </section>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-backdrop" data-close-drawer></div>
    <aside class="drawer-card" role="dialog" aria-modal="true" aria-label="Details">
      <button class="icon-button drawer-close" id="drawer-close" type="button" aria-label="Close">&times;</button>
      <div id="drawer-body"></div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="sr-only" id="live-region" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
