name: Pages
on:
  push:
    branches: [main]
    paths: ['docs/index.html', 'docs/site.css', 'docs/favicon.svg', 'docs/install.*', 'scripts/test-bootstraps.py', '.github/workflows/pages.yml', '.github/workflows/bootstraps.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/bootstraps.yml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public landing page only
        run: |
          mkdir _site
          cp docs/index.html docs/site.css docs/favicon.svg docs/install.ps1 docs/install.sh _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
