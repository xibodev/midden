name: Validate the App
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/midden-ui/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The App's Go contracts
        run: |
          Push-Location apps/midden-ui
          $env:GOWORK = 'off'
          go test ./... -count=1 -timeout=600s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Browser prerequisites
        run: |
          python -m pip install playwright==1.63.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install --with-deps chromium --only-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Browser contracts
        run: |
          python -B -m unittest discover -s apps/midden-ui/webtest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build a native testing package
        run: |
          python -B apps/midden-ui/package.py --out (Join-Path $env:RUNNER_TEMP 'midden-ui-testing')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: midden-ui-testing-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/midden-ui-testing
          if-no-files-found: error
          retention-days: 14
