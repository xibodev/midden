name: Bootstrap tests
on:
  workflow_call:
  pull_request:
    paths: ['docs/install.*', 'scripts/test-bootstraps.py', '.github/workflows/bootstraps.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-bootstraps.py
      - if: runner.os == 'Windows'
        run: python scripts/test-bootstraps.py --powershell powershell
