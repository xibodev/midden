name: Validate
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-renderers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Real Both capabilities on a clean apt-based Linux system
        run: >-
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04
          bash -c 'apt-get update -qq && apt-get install -y -qq python3 curl ca-certificates > /dev/null && python3 /src/scripts/test-linux-renderers.py --disposable-container'
  bootstraps:
    uses: ./.github/workflows/bootstraps.yml
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
            program: pwsh
          - os: windows-latest
            shell: powershell
            program: powershell
          - os: ubuntu-latest
            shell: bash
            program: /bin/bash
          - os: macos-latest
            shell: bash
            program: /bin/bash
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-installers.py --shell ${{ matrix.shell }} --program ${{ matrix.program }}
      - if: runner.os == 'Windows'
        run: python -m pip install pywinpty==2.0.15
      - run: python scripts/test-installer-terminal.py --program ${{ matrix.program }}
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go test -tags headless ./cmd/midden ./internal/install ./internal/module
      - run: git diff --exit-code
