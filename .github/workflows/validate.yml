name: Validate core and bundles
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full deterministic core validation
        run: |
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dependencies = go list -deps ./cmd/midden
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($dependencies -match 'facet-studio|anthropic-sdk|openai-go|copilot-sdk|midden/internal/(module|editorial|create|exec|web)') {
            throw 'Core depends on a retired runtime/editorial layer'
          }
      - name: Installer and archive behavior
        run: |
          python -B -m unittest discover -s tests/installer -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests/release -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independent native products
        run: |
          $target = if ($IsWindows) { 'windows/amd64' } else { 'linux/amd64' }
          $release = Join-Path $env:RUNNER_TEMP 'midden-products'
          python -B scripts/build-release.py --out $release --targets $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/verify-release.py --directory $release --commit $env:GITHUB_SHA --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: midden-products-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/midden-products/*
          if-no-files-found: error
          retention-days: 14
  bundle-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared rendering dependency on the disposable runner
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - name: Install declared HTML inspection dependency
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium --only-shell
      - name: Render and inspect synthetic outcome artifacts
        run: python -B -m unittest discover -s tests/bundles -p "test_*.py" -v
